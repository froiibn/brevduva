# 릴리스: 검증된 태그에서 명시적으로 실행 → 정확한 SHA의 CI 확인 → 5종 자산 검증 → 공개.
#
# 자산 이름에 버전을 넣지 않는다(`brv-<target>.tar.gz`) — install.sh가
# /releases/latest/download/ 고정 URL로 항상 최신을 받기 위함. 버전은 태그가 담는다.
# 리눅스는 musl 정적 링크 — 배포 대상의 glibc 버전에 의존하지 않는다.
# aarch64 리눅스는 공개 리포 무료 arm64 러너로 네이티브 빌드 (크로스 컴파일 배제).
# macOS x86_64만 arm 러너에서 크로스 (Intel 러너 은퇴 대비 — SDK가 양쪽 아치를 지원).
name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 .github/release_tools.py check
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: verify
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      # aws-lc-sys(TLS 암호 구현) 빌드 요구: musl은 musl-gcc, 윈도우 MSVC는 NASM
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: NASM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files\NASM"

      - name: target 추가
        run: rustup target add ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked -p brv --target ${{ matrix.target }}

      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir stage
          cp "target/${{ matrix.target }}/release/brv" LICENSE stage/
          tar -czf "brv-${{ matrix.target }}.tar.gz" -C stage .
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/brv.exe","LICENSE" stage/
          Compress-Archive -Path stage\* -DestinationPath "brv-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: brv-${{ matrix.target }}
          path: brv-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify artifacts and publish atomically
        run: python3 .github/release_tools.py publish
        env:
          GH_TOKEN: ${{ github.token }}
