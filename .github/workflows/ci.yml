# 공개 리포 CI — fmt·clippy·test. 툴체인은 rust-toolchain.toml이 결정한다
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned toolchain
        run: rustup show
      - name: Release procedure regression
        run: python -m unittest discover -s .github/tests
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Regression under an unattended host environment
        run: cargo test -p brv --lib
        env:
          BREVDUVA_BINDING: qa-unattended@isolated
