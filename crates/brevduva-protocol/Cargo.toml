# 공유 crate — 프로토콜 타입·직렬화·검증·토픽 매칭 (PROTOCOL.md의 코드화)
# 리시버(brv)와 서버(클로즈드 리포)가 함께 의존한다 — 이중 구현 금지의 실체
[package]
name = "brevduva-protocol"
description = "Brevduva agent messaging protocol: types, serialization, validation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON Schema 생성 (schemas/ 스냅샷) — 스펙 정식화의 산출물
schemars = "1"
# id·client_key 검증/생성 (PROTOCOL.md 3장)
ulid = "1"
# ts(RFC 3339) 검증 (PROTOCOL.md 3장) — 시각 연산은 소비자(서버) 소관, 여기선 파싱 검증만
time = { version = "0.3", features = ["parsing"] }

[lints]
workspace = true
