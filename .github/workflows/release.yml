# 릴리스: 검증된 태그에서 명시적으로 실행 → 정확한 SHA의 CI 확인 → 5종 자산 검증 → 공개.
#
# 자산 이름에 버전을 넣지 않는다(`brv-<target>.tar.gz`) — install.sh가
# /releases/latest/download/ 고정 URL로 항상 최신을 받기 위함. 버전은 태그가 담는다.
# 리눅스는 musl 정적 링크 — 배포 대상의 glibc 버전에 의존하지 않는다.
# aarch64 리눅스는 공개 리포 무료 arm64 러너로 네이티브 빌드 (크로스 컴파일 배제).
# macOS x86_64만 arm 러너에서 크로스 (Intel 러너 은퇴 대비 — SDK가 양쪽 아치를 지원).
# macOS 자산의 내용물은 앱 묶음 Brevduva.app이다 (2026-09-22) — 단독 실행 파일은 서명해도 시스템 설정에
# 개발자 이름으로 나온다. 자산 이름은 그대로라 install.sh의 고정 URL과 검증 목록이 바뀌지 않는다.
# 윈도우 brv.exe는 Azure Artifact Signing으로 Authenticode 서명한다 (2026-09-30) — 게시자 "Seizia".
# windows-sign-check.yml에서 실측한 단계 그대로다. 서명 자격은 OIDC로만 얻고, 연합 자격 증명은 GitHub 환경
# `signing`(main·v* 태그만 허용)에 묶여 있어 build 잡이 그 환경에서 돈다.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 .github/release_tools.py check
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: verify
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # 윈도우 서명의 OIDC subject가 이 환경 이름을 담는다 (윈도우 외 칸은 토큰을 쓰지 않는다)
    environment: signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      # secrets 컨텍스트는 step의 if에서 못 쓴다 — env로 옮겨 조건에 쓴다
      MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      WINDOWS_SIGNING: ${{ vars.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      # aws-lc-sys(TLS 암호 구현) 빌드 요구: musl은 musl-gcc, 윈도우 MSVC는 NASM
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: NASM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files\NASM"

      - name: target 추가
        run: rustup target add ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked -p brv --target ${{ matrix.target }}

      - name: bundle (macOS — Brevduva.app)
        if: runner.os == 'macOS'
        run: bash .github/macos_bundle.sh "target/${{ matrix.target }}/release/brv" dist "${{ matrix.target }}"

      # macOS: Developer ID 서명 + 공증 + 증명 첨부 (.github/macos_sign.sh). Secrets가 없는 포크는 건너뛰고
      # 서명 없는 묶음 그대로 묶는다 (그 묶음은 SMAppService 등록이 거부될 수 있고, brv는 옛 방식으로 등록한다). 본 리포에서 빠지면 실패시킨다 — 서명 릴리스 뒤에 미서명
      # 릴리스가 나가면 맥의 토큰 저장소가 키체인에서 파일로 되돌아가기 때문이다.
      - name: 서명 Secrets 확인 (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING != 'true' && github.repository == 'froiibn/brevduva'
        run: |
          echo "::error::macOS signing secrets are missing"
          exit 1
      - name: sign + notarize (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash .github/macos_sign.sh dist/Brevduva.app

      - name: package (macOS)
        if: runner.os == 'macOS'
        run: tar -czf "brv-${{ matrix.target }}.tar.gz" -C dist Brevduva.app
      - name: package (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir stage
          cp "target/${{ matrix.target }}/release/brv" LICENSE stage/
          tar -czf "brv-${{ matrix.target }}.tar.gz" -C stage .
      # build.rs는 리소스 컴파일러가 없어도 빌드를 막지 않는다 — 릴리스 exe에서 빠진 것은 여기서 잡는다
      - name: 아이콘·버전 정보 확인 (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $info = (Get-Item "target/${{ matrix.target }}/release/brv.exe").VersionInfo
          if ($info.ProductName -ne 'Brevduva') { throw "windows resources missing from brv.exe" }

      # 윈도우: Authenticode 서명. 설정이 없는 포크는 건너뛰고, 본 리포에서 빠지면 실패시킨다 — 서명 릴리스
      # 뒤에 미서명 릴리스가 나가면 사용자 PC의 승격 창이 다시 "알 수 없는 게시자"로 돌아간다 (macOS와 같은 규칙).
      - name: 서명 설정 확인 (windows)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING != 'true' && github.repository == 'froiibn/brevduva'
        run: |
          echo "::error::windows signing variables are missing"
          exit 1
      - name: azure login (windows)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # 인증서의 유효 기간이 3일이라 타임스탬프가 필수다 — 그래야 서명이 그 뒤에도 유효하다
      - name: sign (windows)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\${{ matrix.target }}\release\brv.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: 서명 확인 (windows)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "target/${{ matrix.target }}/release/brv.exe"
          $sig | Format-List Status, StatusMessage, SignatureType
          "signer   : $($sig.SignerCertificate.Subject)"
          "timestamp: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "brv.exe signature is not valid: $($sig.Status)" }
          if (-not $sig.TimeStamperCertificate) { throw "brv.exe signature has no timestamp" }

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/brv.exe","LICENSE" stage/
          Compress-Archive -Path stage\* -DestinationPath "brv-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: brv-${{ matrix.target }}
          path: brv-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify artifacts and publish atomically
        run: python3 .github/release_tools.py publish
        env:
          GH_TOKEN: ${{ github.token }}
