# Windows 코드 서명 시험: 릴리스를 공개하지 않고 서명 경로만 돌린다 (2026-09-22).
#
# brv.exe는 미서명이라 `brv daemon install`의 관리자 승격 창이 "알 수 없는 게시자"로 뜨고, 받은 exe는
# SmartScreen에 걸린다. Azure Artifact Signing(구 Trusted Signing)으로 서명한다 — 개인키가 Microsoft의
# HSM에 있어 USB 토큰이 필요 없고(2023년부터 코드 서명 키는 하드웨어 보관이 의무다), GitHub에는
# 비밀을 두지 않는다: OIDC로 로그인하고, 아래 값들은 식별자일 뿐이라 리포 Variables에 둔다.
#
#   AZURE_CLIENT_ID · AZURE_TENANT_ID · AZURE_SUBSCRIPTION_ID   앱 등록(연합 자격 증명: 이 리포)
#   ARTIFACT_SIGNING_ENDPOINT   예: https://krc.codesigning.azure.net/  (계정을 만든 리전의 것)
#   ARTIFACT_SIGNING_ACCOUNT · ARTIFACT_SIGNING_PROFILE
#
# 신원 검증이 끝나 위 값이 채워지기 전에는 이 워크플로를 돌려도 첫 단계에서 멈춘다. 서명이 실기에서
# 확인되면 같은 단계를 release.yml로 옮긴다 (macos-sign-check.yml과 같은 순서).
name: windows-sign-check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: 서명 설정 확인
        shell: pwsh
        run: |
          $missing = @()
          if (-not '${{ vars.AZURE_CLIENT_ID }}') { $missing += 'AZURE_CLIENT_ID' }
          if (-not '${{ vars.AZURE_TENANT_ID }}') { $missing += 'AZURE_TENANT_ID' }
          if (-not '${{ vars.AZURE_SUBSCRIPTION_ID }}') { $missing += 'AZURE_SUBSCRIPTION_ID' }
          if (-not '${{ vars.ARTIFACT_SIGNING_ENDPOINT }}') { $missing += 'ARTIFACT_SIGNING_ENDPOINT' }
          if (-not '${{ vars.ARTIFACT_SIGNING_ACCOUNT }}') { $missing += 'ARTIFACT_SIGNING_ACCOUNT' }
          if (-not '${{ vars.ARTIFACT_SIGNING_PROFILE }}') { $missing += 'ARTIFACT_SIGNING_PROFILE' }
          if ($missing) { throw "repository variables not set: $($missing -join ', ')" }

      - uses: actions/checkout@v5

      # aws-lc-sys(TLS 암호 구현) 빌드 요구: 윈도우 MSVC는 NASM (release.yml과 같다)
      - name: NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files\NASM"
      - name: build
        run: cargo build --release --locked -p brv --target ${{ env.TARGET }}

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # 인증서의 유효 기간이 3일이라 타임스탬프가 필수다 — 그래야 서명이 그 뒤에도 유효하다
      - name: sign
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\${{ env.TARGET }}\release\brv.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: 서명 확인
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "target/${{ env.TARGET }}/release/brv.exe"
          $sig | Format-List Status, StatusMessage, SignatureType
          "signer   : $($sig.SignerCertificate.Subject)"
          "issuer   : $($sig.SignerCertificate.Issuer)"
          "timestamp: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "brv.exe signature is not valid: $($sig.Status)" }
          if (-not $sig.TimeStamperCertificate) { throw "brv.exe signature has no timestamp" }

      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item "target/${{ env.TARGET }}/release/brv.exe","LICENSE" stage/
          Compress-Archive -Path stage\* -DestinationPath "brv-${{ env.TARGET }}-signed-trial.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: brv-${{ env.TARGET }}-signed-trial
          path: brv-${{ env.TARGET }}-signed-trial.zip
          if-no-files-found: error
          retention-days: 7
